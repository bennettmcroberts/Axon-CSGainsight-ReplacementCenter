<!doctype html>
<html lang="en" data-ui="axon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axon CS Command Center</title>
<script>!function(){var t=localStorage.getItem('cscc-color-theme');document.documentElement.setAttribute('data-theme',t==='dark'||t==='light'?t:'light')}()</script>
<link rel="stylesheet" href="styles.css?v=20260729m">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<!--AUTH_USER-->
</head>
<body>
<header class="top">
  <div class="brand">
    <a href="index.html" class="logo" title="Back to home">
      <span class="logo-word">AXON</span>
    </a>
    <div>
      <h1>Customer Success Command Center</h1>
      <div class="sub">Renewal intelligence &amp; account health · Protect Life</div>
    </div>
  </div>
  <div class="topright">
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle color theme"></button>
    <span class="modebadge" id="modeBadge">connecting&hellip;</span>
    <span id="asof"></span>
    <span class="mini" id="whoami" style="color:var(--muted)"></span>
    <button type="button" class="btn sm" id="logoutBtn" onclick="doLogout()">Log out</button>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <nav class="icon-rail" id="iconRail"></nav>
    <div class="flyout hidden" id="flyout"></div>
  </aside>

  <div class="main">
    <div class="inner">
    <div class="scopebar" id="scopebar">
      <div class="crumb" id="crumb"></div>
      <div class="viewas" id="viewas"></div>
      <div class="role" id="scoperole"></div>
    </div>

    <div id="app">
      <div class="loading">
        <div class="spinner"></div>
        <div>Connecting — renewals, org hierarchy, purchase history &amp; support signals…</div>
      </div>
    </div>

    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toastHost"></div>

<script>window.AXON_THEME=true;</script>
<script src="/assets/theme.js?v=20260716d"></script>
<script src="/assets/app.js?v=20260801m"></script>
</body>
</html>
